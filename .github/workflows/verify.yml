name: Verify Python backend and frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Match the pg_dump/pg_restore clients bundled in the Ubuntu 24.04 runner.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: viabileasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viabileasy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/viabileasy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend tests/python
      - run: ruff format --check backend tests/python
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm run test:frontend
      - run: npm run verify:geometry
      - run: npm run build:public
      - run: git diff --exit-code -- dist/index.html
      - name: Compile Cloudflare Pages API function
        run: npx --yes wrangler@4.155.0 pages functions build --outdir "$RUNNER_TEMP/viabileasy-pages-functions" --compatibility-date 2026-10-28
      - name: Build Linux production image
        run: docker build -t viabileasy-ci .
      - name: Start production container and verify readiness
        run: |
          trap 'docker rm -f viabileasy-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name viabileasy-ci --network host \
            -e HOST=127.0.0.1 -e PORT=4174 \
            -e APP_URL=https://viabileasy-ci.invalid \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" \
            -e BREVO_API_KEY=ci-placeholder \
            -e 'MAIL_FROM=ViabilEasy <ci@ci.invalid>' viabileasy-ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/api/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs viabileasy-ci
          exit 1
