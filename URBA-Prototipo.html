function applyProduct(id){const p=products.find(p=>p.id===id);if(!p||!guardSelection())return;for(const k of ['floors','to','efficiency','unitArea','use'])state[k]=p[k];state.scenario='base';goExplore();notify(`${p.name}: hipótese aplicada. Ajuste as premissas no estúdio.`)}
function calc(lot=state.lot,config=state){
  const baseCa=2, maxCa=3, floors=config.floors;
  const legalFootprint=lot.area*config.to/100;
  const width=Math.max(0,lot.width-6),depth=Math.max(0,lot.depth-10);
  const setbackPlate=lot.custom?lot.area*.58:width*depth;
  const footprint=Math.max(0,Math.min(legalFootprint,setbackPlate,lot.area*maxCa/floors,config.use==='H1'?config.unitArea/(config.efficiency/100)/floors:Infinity));
  const gross=footprint*floors, sellable=gross*config.efficiency/100;
  const units=Math.floor((sellable+1e-7)/config.unitArea),saleArea=units*config.unitArea;
  const retail=config.use==='Misto'?footprint*.45:0;
  const residentialUnits=config.use==='Misto'?Math.max(0,Math.floor((sellable-retail)/config.unitArea)):units;
  const netSale=config.use==='Misto'?residentialUnits*config.unitArea+retail:saleArea;
  const totalBuilt=gross+(config.use==='H1'?0:lot.area*.35);
  const vgv=netSale*config.price,direct=totalBuilt*config.cost,indirect=direct*config.indirect/100;
  const nonLand=direct+indirect,targetProfit=vgv*config.profit/100,residual=vgv-nonLand-targetProfit;
  const margin=vgv>0?(vgv-nonLand-config.landPrice)/vgv*100:0;
  return {baseCa,maxCa,footprint,gross,sellable:netSale,units:residentialUnits,retail,totalBuilt,vgv,direct,indirect,nonLand,targetProfit,residual,margin,height:floors*3,ca:gross/lot.area,parking:Math.floor(lot.area*.35/28)};
}

function runCoordinateSearch(){state.lookupValues.latitude=$('#lookup-lat')?.value??state.lookupValues.latitude;state.lookupValues.longitude=$('#lookup-lng')?.value??state.lookupValues.longitude;const lat=decimalCoordinate(state.lookupValues.latitude),lng=decimalCoordinate(state.lookupValues.longitude);if(lat===null||Math.abs(lat)>90)return showLookupResult({status:'error',field:'lookup-lat',message:'Informe a latitude em graus decimais, entre -90 e 90. Exemplo: -7.0816.'});if(lng===null||Math.abs(lng)>180)return showLookupResult({status:'error',field:'lookup-lng',message:'Informe a longitude em graus decimais, entre -180 e 180. Exemplo: -34.8368.'});if(!inDemoRegion(lat,lng))return showLookupResult({status:'error',field:'lookup-lat',swapped:inDemoRegion(lng,lat),message:inDemoRegion(lng,lat)?'Latitude e longitude parecem invertidas para João Pessoa. Confira ou use o botão para inverter.':'O ponto está fora do recorte demonstrativo de João Pessoa. Confira os valores; não foi identificado um lote.'});const found=lots.find(l=>Math.abs(l.lat-lat)<1e-8&&Math.abs(l.lng-lng)<1e-8);showLookupResult(found?{status:'candidate',method:'coordinates',lotId:found.id,lat,lng}:{status:'point',method:'coordinates',lat,lng})}
function runRegistrationSearch(){state.lookupValues.registration=$('#lookup-registration')?.value??state.lookupValues.registration;state.lookupValues.office=$('#lookup-office')?.value??state.lookupValues.office;const raw=state.lookupValues.registration.trim();if(!/^(?:\d{1,12}|\d{1,3}(?:\.\d{3}){1,3})$/.test(raw)||!/[1-9]/.test(raw))return showLookupResult({status:'error',field:'lookup-registration',message:'Informe o número da matrícula, com ou sem pontos. Exemplo demonstrativo: 12.345.'});const registration=raw.replace(/\./g,'').replace(/^0+/,'');if(!demoOffices.some(o=>o.id===state.lookupValues.office))return showLookupResult({status:'error',field:'lookup-office',message:'Selecione o cartório. O número da matrícula deve ser consultado no cartório correspondente.'});const found=lots.find(l=>l.registration?.number===registration&&l.registration.office===state.lookupValues.office);showLookupResult(found?{status:'candidate',method:'registration',lotId:found.id,registration,office:state.lookupValues.office}:{status:'unresolved',method:'registration',registration,office:state.lookupValues.office})}
function confirmLookup(){const r=state.lookupResult;if(!r||r.status!=='candidate'||state.lookupDirty)return;const context=r.method==='registration'?{method:'registration',registration:lots.find(l=>l.id===r.lotId).registration.formatted,office:r.office,verified:false}:{method:'coordinates',lat:r.lat,lng:r.lng,verified:false};selectLot(r.lotId,context);state.lookupResult={status:'selected'};render();$('#lookup-result')?.focus({preventScroll:false});notify('Lote de demonstração confirmado. Dados oficiais ainda pendentes.')}
function guardSelection(){if(state.lotConfirmed&&!state.lookupDirty)return true;state.step=1;render();const target=state.lookupDirty?$('#lookup-dirty'):$('#lookup-result');target?.focus?.({preventScroll:false});notify(state.lookupDirty?'Confirme os dados editados na busca antes de analisar.':'Selecione ou informe um perímetro antes de abrir a análise.');return false}
function markLookupDirty(){state.lookupDirty=true;$('#lookup-dirty')?.removeAttribute('hidden');$$('[data-action="analyze"],[data-action="confirm-lookup"]').forEach(b=>b.disabled=true);$$('[data-step]').forEach(b=>{if(Number(b.dataset.step)>1){b.disabled=true;b.setAttribute('aria-disabled','true')}})}
function parseCoordinatePair(text){let parts=text.trim().replace(/^\(|\)$/g,'').split(';').map(x=>x.trim());if(parts.length!==2){const m=text.trim().replace(/^\(|\)$/g,'').match(/^([+-]?\d+(?:\.\d+)?)\s*,\s*([+-]?\d+(?:\.\d+)?)$/);if(m&&(text.includes('.')||/,\s/.test(text)||/,[+-]/.test(text)))parts=[m[1],m[2]];else parts=text.trim().split(/\s+/)}if(parts.length!==2)return null;const numbers=parts.map(decimalCoordinate);return numbers.every(n=>n!==null)?parts:null}

function mapPanel(){return `${lookupFields()}<div class="map-frame ${state.drawing?'drawing':''}" id="map-frame">${mapSvg()}<div class="map-overlay-top"><span class="map-label">${icon('pin')}João Pessoa, PB</span><span class="map-label">Mapa esquemático</span></div><div class="compass">N<svg viewBox="0 0 24 34" aria-hidden="true"><path d="M12 1L22 31 12 24z" fill="#547749"/><path d="M12 1L2 31 12 24z" fill="#fbfcf6" stroke="#c6d3b6" stroke-width=".7"/></svg></div><button class="map-layer-button" data-action="layers" aria-expanded="${state.layerMenu}" ${state.layerMenu?'aria-controls="map-layers"':''}>${icon('layers')}Camadas${icon('chevrons')}</button>${state.layerMenu?`<div class="layer-menu" id="map-layers" aria-label="Camadas do mapa"><label><input type="checkbox" data-layer="parcels" ${state.layers.parcels?'checked':''}>Lotes ilustrativos</label><label><input type="checkbox" data-layer="zoning" ${state.layers.zoning?'checked':''}>Zoneamento de exemplo</label><label><input type="checkbox" data-layer="constraints" ${state.layers.constraints?'checked':''}>Faixa de atenção à orla</label></div>`:''}<div class="map-controls"><div class="stack"><button data-action="map-plus" aria-label="Ampliar mapa">${icon('plus')}</button><button data-action="map-minus" aria-label="Reduzir mapa">${icon('minus')}</button></div><button data-action="map-reset" aria-label="Centralizar mapa">${icon('target')}</button></div><div class="map-scale"><div></div>escala ilustrativa</div>${state.drawing?`<div class="draw-banner"><span role="status">${state.drawPoints.length?`${state.drawPoints.length} vértices. Toque ou clique para adicionar pontos.`:'Toque ou clique no mapa para marcar os vértices.'}</span><div class="flex-row">${btn('Desfazer','','draw-undo')}${btn('Cancelar','','draw-cancel')}${btn('Concluir','check','draw-finish','primary')}</div></div>`:''}</div><div class="map-footer"><span class="map-footnote">${icon('info')}Mapa esquemático · lotes fictícios · sem cadastro oficial</span>${state.lotConfirmed?`<span class="map-legend"><span><i class="legend-dot"></i>Terreno selecionado</span><span><i class="legend-dot zone"></i>Quadras</span></span>`:''}</div>`}
function lotPanel(){if(!state.lotConfirmed)return pendingLotPanel();const l=state.lot;return `<aside class="panel lot-panel"><div class="panel-top"><span class="panel-kicker">${icon('scan')}TERRENO SELECIONADO</span>${status(l.custom?'ESTIMADO':'DEMONSTRAÇÃO',l.custom?'estimated':'')}</div><div class="lot-title"><h2>${esc(l.name)}</h2><p>${icon('pin')}${esc(l.address)}</p></div><div class="lot-area"><div><strong>${number(l.area)} <small>m²</small></strong><small>Área total do terreno ${l.custom?'· aproximada':''}</small></div><svg class="lot-shape" viewBox="0 0 70 56" aria-hidden="true"><path d="M8 15L49 5 62 43 21 53z" fill="#edf3e1" stroke="#8aa66c" stroke-width="1" stroke-dasharray="3 2"/><path d="M18 22l25-6 8 23-25 6z" fill="#c9dca9"/><text x="28" y="12" font-size="6" fill="#92a77b" transform="rotate(-14 28 12)">${number(l.width)} m</text></svg></div><div class="lot-details"><div class="detail-row"><span>Dimensões ${l.custom?'aproximadas':''}</span><strong>${number(l.width)} × ${number(l.depth)} m</strong></div><div class="detail-row"><span>Uso de referência</span><strong>A definir na análise</strong></div><div class="detail-row"><span>Contexto</span><strong>${l.custom?'Não identificado':l.coastal?'Orla · atenção especial':'Tecido urbano consolidado'}</strong></div>${l.registration?`<div class="detail-row"><span>Matrícula fictícia</span><strong>${esc(l.registration.formatted)}</strong></div><div class="detail-row"><span>Cartório de exemplo</span><strong>${esc(officeLabel(l.registration.office))}</strong></div>`:''}<div class="detail-row"><span>${l.id==='I01'?'Coordenadas informadas':'Coordenadas de exemplo'}</span><strong>${number(l.lat,4)}, ${number(l.lng,4)}</strong></div></div><div class="lot-divider"></div><div class="data-origin">${icon('info')}Geometria ${l.custom?'informada pelo usuário, com área aproximada':'e localização ilustrativas'}. Confirme o perímetro em uma base oficial na versão operacional.</div><div class="lot-action">${btn('Analisar este terreno','arrowRight','analyze','primary wide big')}<small>Veja índices, condicionantes e potencial construtivo</small></div><div class="panel-footer">${icon('shield')}Resultados preliminares e rastreáveis</div></aside>`}
function findView(){return `<div class="analysis-layout"><section class="map-column">${mapPanel()}<section class="mobile-selection" id="map-selection" tabindex="-1" aria-label="Terreno selecionado"><span class="eyebrow">TERRENO SELECIONADO</span><strong>${esc(state.lot.name)} · ${number(state.lot.area)} m²</strong>${btn('Ver análise deste terreno','arrowRight','analyze','primary wide')}</section><div class="insight-strip">${icon('leaf')}<p><strong>Do terreno à decisão, com mais clareza.</strong><br>Entenda o que é potencial legal, capacidade geométrica e hipótese de produto.</p><button data-action="about">Como funciona ${icon('arrowRight')}</button></div></section>${lotPanel()}</div>${recentCards()}`}
function metric(label,value,note='',cls=''){return `<div class="metric ${cls}"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`}
function criticalNotice(){return state.lot.coastal?`<div class="notice">${icon('alert')}<div><strong>Resultado jurídico bloqueado: incidência de orla não validada.</strong><br>Regimes concorrentes precisam de avaliação profissional. Os volumes exibidos são hipóteses de comparação, sem enquadramento legal.</div></div>`:`<div class="notice">${icon('info')}<div><strong>Análise demonstrativa.</strong> Índices, zona e recuos são fictícios. A confirmação do potencial depende de camadas oficiais e revisão normativa.</div></div>`}
function productIllustration(p){const levels=p.floors,h=levels*13,y=151-h;let windows='';for(let i=0;i<levels;i++)for(let j=0;j<4;j++)windows+=`<path d="M${90+j*14} ${y+8+i*13}v7h9v-7z" fill="${p.id==='offices'?'#aed4e0':'#d3e7dd'}" opacity=".92"/>`;return `<svg class="product-illustration" viewBox="0 0 240 190" aria-hidden="true"><defs><linearGradient id="sky-${p.id}" x2="0" y2="1"><stop stop-color="#dceaf0"/><stop offset="1" stop-color="#f6f6ef"/></linearGradient></defs><rect width="240" height="190" fill="url(#sky-${p.id})"/><path d="M14 154l109-31 104 31-105 31z" fill="#c4d8c0"/><path d="M26 159l98-28 88 25-90 26z" fill="#e4ead9" stroke="#85a68b" stroke-dasharray="4 4"/><path d="M78 151V${y}h75v${h}z" fill="${p.color}"/><path d="M153 ${y}l35-19v${h}l-35 19z" fill="#173f4b" opacity=".45"/><path d="M78 ${y}l35-19h75l-35 19z" fill="#e8ede7"/>${windows}<path d="M104 151v-16h17v21" fill="#254655"/><path d="M20 165l101 29 108-31" fill="none" stroke="#b4c4c3" stroke-width="8"/><path d="M204 145v20 M40 139v17" stroke="#8a9b70" stroke-width="3"/><circle cx="204" cy="138" r="13" fill="#739d7c"/><circle cx="40" cy="132" r="12" fill="#8dac7b"/></svg>`}

function rulesDiagnostic(){const c=calc();const rules=[['CA básico / máximo','2,0 / 3,0','Índice × área do lote'],['Taxa de ocupação',`${state.to}%`,'Projeção no térreo'],['Permeabilidade mínima','20%','Hipótese de demonstração'],['Recuo frontal / fundos','5,0 / 5,0 m','Envelope simplificado'],['Recuos laterais','3,0 m','Duas laterais'],['Gabarito de referência','8 pav. · 24 m','Depende de homologação']];return `<div class="diagnostic-grid"><section><div class="diag-heading"><div><h2>Um terreno. Possibilidades à vista.</h2><p>${esc(state.lot.name)} · ${number(state.lot.area)} m² · versão de cenário 01</p></div>${status(state.lot.coastal?'BLOQUEADO':'PRELIMINAR',state.lot.coastal?'blocked':'estimated')}</div>${criticalNotice()}<div class="metrics-grid">${metric('ÁREA DO LOTE',`${number(state.lot.area)} <small>m²</small>`,'Geometria de demonstração')}${metric('LIMITE POR CA MÁXIMO',`${number(state.lot.area*c.maxCa)} <small>m²</small>`,'Hipótese CA 3,0 · não homologado','accent')}${metric('PROJEÇÃO SIMULADA',`${number(c.footprint)} <small>m²</small>`,'Menor limite entre TO, recuos e CA')}</div><div class="panel"><div class="panel-title"><h3>Parâmetros urbanísticos</h3><small>Pacote de regras ilustrativo</small></div><table class="rule-table"><thead><tr><th>Parâmetro</th><th>Valor de cenário</th><th>Confiança</th><th>Evidência</th></tr></thead><tbody>${rules.map(([name,value,note])=>`<tr><td>${name}</td><td>${value}</td><td>${status('ESTIMADO')}</td><td><button class="rule-link" data-rule="${esc(name)}">Ver premissa ${icon('external')}</button></td></tr>`).join('')}</tbody></table></div><div class="bottom-action"><p>Os limites independentes serão combinados na simulação.</p>${btn('Explorar em 3D','arrowRight','explore','primary')}</div></section><aside class="side-stack"><div class="panel"><div class="panel-title"><h3>Prévia do envelope</h3>${icon('cube')}</div><canvas class="side-3d-preview" data-canvas="preview" aria-label="Prévia interativa da massa do edifício"></canvas><div class="side-3d-caption"><span>${state.floors} pavimentos · ${c.height} m</span><button data-action="explore">Abrir estúdio ${icon('arrowRight')}</button></div></div><div class="panel"><div class="panel-title"><h3>Antes de avançar</h3>${status('3 PENDÊNCIAS','pending')}</div><div class="check-list"><div class="check-item">${icon('layers')}<div>Confirmar cadastro e zoneamento<p>Malha e classificação viária oficiais não integradas.</p></div></div><div class="check-item">${icon('book')}<div>Validar o pacote normativo<p>Artigos, anexos e vigência aguardam revisão.</p></div></div><div class="check-item">${icon('ruler')}<div>Conferir topografia e testadas<p>Plano horizontal assumido. Sem avaliação de declividade.</p></div></div></div></div></aside></div>`}

function controlPanel(){const c=calc(),p=activeProduct(),house=state.use==='H1';return `<aside class="panel controls-panel"><h3>Seu cenário, suas hipóteses.</h3><p>Explore o volume dentro dos limites fictícios do exemplo.</p><div class="control-field"><label class="control-label" for="product-select">Produto em estudo</label><select id="product-select" data-product-select>${products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select><p class="field-note">Permissão de uso pendente. Trocar o produto aplica as premissas iniciais.</p></div><div class="control-field"><label class="control-label" for="floor-range">Pavimentos <strong id="floor-label">${state.floors} pav.</strong></label><input id="floor-range" type="range" min="1" max="${house?2:8}" value="${state.floors}" data-control="floors"><div class="range-caps"><span>1 pavimento</span><span>${house?2:8} pavimentos</span></div></div><div class="control-field"><label class="control-label" for="to-range">Ocupação solicitada <strong id="to-label">${state.to}%</strong></label><input id="to-range" type="range" min="20" max="60" step="5" value="${state.to}" data-control="to"><div class="range-caps"><span>20%</span><span>60%</span></div><p class="field-note">Recuos e CA podem limitar a projeção efetiva.</p></div><div class="control-field"><label class="control-label" for="unit-range">Área útil por unidade <strong id="unit-label">${state.unitArea} m²</strong></label><input id="unit-range" type="range" min="${house?100:25}" max="${house?400:140}" step="5" value="${state.unitArea}" data-control="unitArea"><div class="range-caps"><span>${house?100:25} m²</span><span>${house?400:140} m²</span></div></div><div class="control-field"><div class="control-label">Camadas do modelo</div><button class="switch-label" data-action="toggle-envelope" aria-pressed="${state.envelope}">Limite de envelope<span class="switch ${state.envelope?'on':''}"></span></button><button class="switch-label" data-action="toggle-setbacks" aria-pressed="${state.setbacks}">Área de recuos<span class="switch ${state.setbacks?'on':''}"></span></button></div><div class="control-field"><div class="scenario-choice"><span>CA efetivo da massa</span><strong id="effective-ca">${number(c.ca,2)}</strong></div><p class="field-note">Eficiência física: ${state.efficiency}%. ${house?'Uma casa, limitada pela área útil solicitada.':'Sem projeto de garagem ou validação de unidades.'}</p></div></aside>`}

function summaryView(){const c=calc();return `<div class="summary-layout"><section><div class="executive-hero"><div class="eyebrow">LEITURA DO TERRENO · ${esc(state.lot.id)}</div><h2>O potencial começa<br>com boas premissas.</h2><p>${esc(state.lot.name)}, João Pessoa.<br>Uma visão integrada para explorar a próxima decisão.</p>${btn('Abrir diagnóstico','arrowRight','diagnosis','primary')}<canvas class="executive-building" data-canvas="decor" aria-label="Ilustração da massa do cenário"></canvas></div><div class="summary-metrics">${metric('TERRENO',`${number(state.lot.area)} <small>m²</small>`,'Lote de demonstração')}${metric('ÁREA COMPUTÁVEL',`${number(c.gross)} <small>m²</small>`,'Cenário paramétrico atual')}${metric('HIPÓTESE DE PRODUTO',`${c.units} <small>unidades</small>`,'Área e eficiência editáveis')}${metric('STATUS DO ESTUDO','Preliminar','Fontes e parâmetros não homologados','accent')}</div><div class="section-title"><h2>Uma decisão em três camadas</h2></div><div class="evidence-row"><span class="evidence-number">01</span><div><h3>Potencial legal</h3><p>Zoneamento, permissões e condicionantes.</p></div>${status('PENDENTE','pending')}</div><div class="evidence-row"><span class="evidence-number">02</span><div><h3>Capacidade geométrica</h3><p>Volume simulado a partir de recuos, TO e CA.</p></div>${status('ESTIMADO')}</div><div class="evidence-row"><span class="evidence-number">03</span><div><h3>Atratividade econômica</h3><p>Receita e custos sob hipóteses explícitas.</p></div>${status('ESTIMADO')}</div></section><aside class="summary-right"><div class="panel"><div class="panel-title"><h3>O cenário em perspectiva</h3>${icon('cube')}</div><canvas class="side-3d-preview" data-canvas="preview" aria-label="Volumetria do cenário"></canvas><div class="side-3d-caption"><span>${state.floors} pavimentos · ${c.height} m</span><button data-action="open-studio">Explorar ${icon('arrowRight')}</button></div></div><div class="panel controls-panel"><div class="panel-kicker">${icon('file')}ESTUDO PRELIMINAR</div><h3 style="margin-top:15px">Leve a análise com você.</h3><p style="margin:9px 0 16px">Relatório com parâmetros, hipóteses e pendências para a próxima conversa com sua equipe.</p>${btn('Visualizar relatório','file','open-report','primary wide')}${btn('Comparar alternativas','compare','open-compare','wide section-space')}</div>${criticalNotice()}</aside></div>`}
function scenarioData(){const house=state.use==='H1',p=activeProduct();return [{id:'compact',name:'Compacto',floors:Math.max(1,p.floors-2),to:Math.max(20,p.to-5)},{id:'base',name:'Base',floors:p.floors,to:p.to},{id:'max',name:'Máximo do exemplo',floors:house?2:8,to:60}].map(s=>({...s,...calc(state.lot,{...state,floors:s.floors,to:s.to})}))}
function compareView(){const data=scenarioData();const rows=[['Pavimentos',d=>`${d.floors} pavimentos`],['Projeção efetiva',d=>`${number(d.footprint)} m²`],['Área computável',d=>`${number(d.gross)} m²`],['CA efetivo',d=>number(d.ca,2)],['Unidades estimadas',d=>`${d.units} ${activeProduct().noun} de ${state.unitArea} m²`],['Altura geométrica',d=>`${d.height} m`],['Área vendável',d=>`${number(d.sellable)} m²`],['VGV simulado',d=>compact(d.vgv)],['Residual estático',d=>compact(d.residual)]];return `<div class="section-title"><h2>Quatro produtos para o mesmo terreno.</h2></div><p class="comparison-note">Premissas iniciais por tipologia; simulações com permissão de uso pendente. Selecionar um produto reinicia seus parâmetros.</p>${productCards()}${criticalNotice()}<div class="section-title"><h2>Variações de volume · ${activeProduct().name}.</h2><span>Mesmas premissas de preço e custo</span></div><div class="panel" style="overflow:auto"><table class="compare-table"><thead><tr><th>Parâmetro</th>${data.map(d=>`<th class="${state.scenario===d.id?'selected':''}">${d.name}</th>`).join('')}</tr></thead><tbody>${rows.map(([title,fn])=>`<tr><td>${title}</td>${data.map(d=>`<td class="${state.scenario===d.id?'selected':''}">${fn(d)}</td>`).join('')}</tr>`).join('')}<tr><td>Explorar hipótese</td>${data.map(d=>`<td class="${state.scenario===d.id?'selected':''}"><button class="btn ${state.scenario===d.id?'primary':''}" data-scenario="${d.id}">${state.scenario===d.id?'Selecionado':'Usar cenário'}</button></td>`).join('')}</tr></tbody></table></div><p class="financial-note comparison-note">“Máximo” refere-se somente aos limites fictícios deste protótipo. Unidades e vagas dependem de projeto; valores econômicos não incluem outorga, fluxo mensal ou tributos individualizados.</p>`}
function financeView(){return `<div class="notice print-hide">${icon('info')}<div><strong>Sandbox econômico.</strong> Simulação estática com números editáveis, sem cotações de mercado. Não há recomendação de compra; outorga e fluxo de caixa ainda não foram modelados.</div></div><div class="finance-layout section-space"><form class="panel finance-form" id="finance-form"><div class="panel-kicker">${icon('settings')}PREMISSAS DO CENÁRIO</div>${financeField('Preço realizável','price',state.price,'R$','/ m²')}${financeField('Custo direto de obra','cost',state.cost,'R$','/ m²')}${financeField('Preço proposto do terreno','landPrice',state.landPrice,'R$','')}${financeField('Indiretos e contingência','indirect',state.indirect,'','%')}${financeField('Lucro alvo sobre VGV','profit',state.profit,'','%')}<p class="field-note">Obra aplicada à área construída total: área computável + 35% do lote em apoio/garagem. Hipótese física simplificada, sem projeto de vagas.</p><button class="btn primary wide" type="submit">${icon('rotate')}Atualizar simulação</button></form><div class="finance-results" id="finance-results">${financeResults()}</div></div>`}
function financeField(label,id,value,prefix,suffix){return `<div class="form-field"><label for="fin-${id}">${label}</label><div class="input-affix"><span>${prefix}</span><input id="fin-${id}" name="${id}" type="number" min="0" max="${id==='profit'||id==='indirect'?100:1000000000}" step="${id==='profit'||id==='indirect'?1:100}" value="${value}" required><span>${suffix}</span></div></div>`}
function financeResults(){const c=calc(),values=[c.vgv,c.direct,c.indirect,c.targetProfit,c.residual],names=['VGV','Obra direta','Indiretos','Lucro alvo','Residual'];return `<div class="metrics-grid">${metric('VGV SIMULADO',compact(c.vgv),`${number(c.sellable)} m² vendáveis × ${money(state.price)}/m²`)}${metric('CUSTO SEM TERRENO',compact(c.nonLand),`${number(c.totalBuilt)} m² construídos · base simplificada`)}${metric('RESIDUAL ESTÁTICO',compact(c.residual),'Após custo sem terreno e lucro alvo','accent')}</div><div class="panel chart-panel"><div class="chart-heading"><h3>Da receita ao residual</h3><span>Valores nominais · R$ milhões</span></div><div class="waterfall">${values.map((v,i)=>`<div class="waterfall-item"><div class="waterfall-bar" style="height:${Math.max(3,Math.min(100,Math.abs(v)/Math.max(1,c.vgv)*100))}%"><span class="waterfall-value">${number(v/1e6,2)}</span></div><span class="waterfall-label">${names[i]}</span></div>`).join('')}</div><p class="financial-note">Residual = VGV − custo sem terreno − lucro alvo. Margem ilustrativa com o terreno a ${money(state.landPrice)}: <strong>${number(c.margin,1)}%</strong>. Valores não incluem outorga nem desconto a valor presente.</p></div><div class="panel chart-panel"><div class="chart-heading"><h3>E se preço e custo mudarem?</h3><span>Residual estático</span></div><table class="sensitivity-table"><thead><tr><th>Custo ↓ / preço →</th><th>−10%</th><th>Base</th><th>+10%</th></tr></thead><tbody>${[1.1,1,.9].map((costFactor,r)=>`<tr><th>${r===0?'+10%':r===1?'Base':'−10%'}</th>${[.9,1,1.1].map((priceFactor,col)=>{const v=c.vgv*priceFactor*(1-state.profit/100)-c.nonLand*costFactor;return `<td class="${r===1&&col===1?'base':v<0?'stress':''}">${compact(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table><p class="financial-note">Preço realizável e custos variam de forma independente. TIR, VPL, permuta e financiamento pertencem às próximas ondas do produto.</p></div></div>`}
function reportView(){const c=calc(),l=state.lot;return `<div class="report-layout"><article class="report-paper" id="report-paper"><div class="report-letterhead"><span class="report-logo">ViabilEasy</span><small>INTELIGÊNCIA URBANÍSTICA<br>ESTUDO DEMONSTRATIVO · ${esc(l.id)} / 2026</small></div><h2>Estudo de potencial construtivo</h2><p>${esc(l.name)} · João Pessoa / PB<br>Lote fictício ${esc(l.id)} · ${number(l.area)} m²</p><div class="report-watermark">PRELIMINAR · DADOS DEMONSTRATIVOS</div><div class="report-block"><h3>01 · Identificação e cenário</h3><p class="report-lookup">${esc(lookupReference())}. Vínculo registral não validado.</p><div class="report-keyvalues"><div><span>Área do terreno</span><strong>${number(l.area)} m²</strong></div><div><span>Uso simulado</span><strong>${activeProduct().name}</strong></div><div><span>Pavimentos</span><strong>${state.floors}</strong></div><div><span>Área computável</span><strong>${number(c.gross)} m²</strong></div><div><span>Projeção efetiva</span><strong>${number(c.footprint)} m²</strong></div><div><span>Hipótese de produto</span><strong>${c.units} ${activeProduct().noun} · ${state.unitArea} m²</strong></div></div></div>${state.reportGeometry?`<div class="report-block"><h3>02 · Massa conceitual</h3><div class="report-visuals"><div class="report-map">${mapSvg()}</div><canvas class="report-canvas" data-canvas="report" aria-label="Massa conceitual para o relatório"></canvas></div></div>`:''}${state.reportAssumptions?`<div class="report-block"><h3>03 · Premissas e limites</h3><p>CA básico 2,0 e máximo 3,0; TO solicitada de ${state.to}%; permeabilidade de referência de 20%; recuos de 5 m à frente e aos fundos e 3 m nas laterais. Todos estes parâmetros são fictícios. Terreno plano assumido, sem levantamento topográfico. Eficiência de ${state.efficiency}%. A massa não valida acesso, acessibilidade, garagem, ventilação, implantação ou projeto arquitetônico.</p><p style="margin-top:7px">VGV: ${money(c.vgv)}. Custo direto: ${money(state.cost)}/m² construído. Residual estático: ${money(c.residual)}. Simulação sem outorga, fluxo mensal e revisão fiscal. Não representa recomendação de aquisição.</p></div>`:''}<div class="report-block"><h3>Alternativas de produto · premissas iniciais</h3><table class="compare-table"><thead><tr><th>Produto</th><th>Unidades</th><th>Pavimentos</th><th>Área computável</th></tr></thead><tbody>${productData().map(p=>`<tr><td>${p.name}</td><td>${p.units}</td><td>${p.floors}</td><td>${number(p.gross)} m²</td></tr>`).join('')}</tbody></table><p>Hipóteses iniciais para comparação, independentes dos ajustes do cenário acima. Todas as permissões de uso estão pendentes; a imagem conceitual de referência não fornece índices legais.</p></div><div class="report-block"><h3>04 · Pendências para validação</h3><p>${l.coastal?'BLOQUEADO: enquadramento da orla e eventuais regimes jurídicos concorrentes. ':''}PENDENTE: cadastro oficial do lote, zoneamento, classe viária e permissão do uso simulado. PENDENTE: artigos, anexos, vigência e validação jurídica do pacote de regras. PENDENTE: topografia e restrições ambientais/patrimoniais. Sem responsável técnico ou aprovação de órgão competente.</p></div>${state.reportSources?`<div class="report-block"><h3>05 · Origem e rastreabilidade</h3><p>Referência de produto: Especificação Técnica Consolidada v3.0, de 16/10/2026. Dados territoriais e índices: conjunto sintético DEMO-JP-01. Modelo: ViabilEasy prototype 0.4. Catálogo normativo não homologado. Não há hash de pacote legal ativo, assinatura técnica ou consulta em tempo real.</p><div class="report-extras">Fontes previstas, sem integração nesta demonstração: PDMJP / legislação vigente; Filipeia / Atlas municipal; SUDEMA; CBMPB.</div></div>`:''}<div class="report-extras">Gerado em ${new Date().toLocaleDateString('pt-BR',{timeZone:'America/Fortaleza'})} · Cenário ${esc({base:'base',compact:'compacto',max:'máximo do exemplo',custom:'personalizado'}[state.scenario]||state.scenario)} · O estudo é uma demonstração de interface e não substitui análise técnica, certidão urbanística ou projeto.</div></article><aside class="panel report-options"><h3>Preparar relatório</h3><label><input type="checkbox" data-report="reportGeometry" ${state.reportGeometry?'checked':''}>Incluir volumetria</label><label><input type="checkbox" data-report="reportAssumptions" ${state.reportAssumptions?'checked':''}>Incluir premissas</label><label><input type="checkbox" data-report="reportSources" ${state.reportSources?'checked':''}>Incluir rastreabilidade</label>${btn('Imprimir / salvar PDF','download','print','primary wide')}${btn('Exportar cenário JSON','code','export','wide')}<p class="field-note">Na janela de impressão do navegador, escolha “Salvar como PDF”. Pendências críticas permanecem no relatório.</p></aside></div>`}
function overview(){const c=calc();return `${heading('SEU WORKSPACE','Um novo olhar sobre cada terreno.','Organize estudos e transforme hipóteses em conversas mais claras.') }<div class="overview-hero"><div><div class="eyebrow">INTELIGÊNCIA PARA EXPLORAR</div><h2>Antes de construir,<br>entenda as possibilidades.</h2><p>Território, regras e produto em uma mesma análise.</p>${btn('Começar uma análise','arrowRight','new-analysis','primary')}</div><div class="overview-decoration"><canvas data-canvas="decor" aria-label="Volumetria ilustrativa"></canvas></div></div><div class="overview-stats">${metric('TERRENOS NO WORKSPACE',state.saved.size,'Registros de demonstração')}${metric('PRODUTOS PARA EXPLORAR','4','Casa, apartamentos, salas e flats')}${metric('FONTES MAPEADAS','4','Referências para futura integração')}${metric('BASE HOMOLOGADA','Pendente','O protótipo utiliza dados sintéticos','accent')}</div>${recentCards()}<div class="section-space">${criticalNotice()}</div>`}
function projects(){const saved=lots.filter(l=>state.saved.has(l.id));for(const entry of Object.values(state.savedCustom))if(state.saved.has(entry.lot.id))saved.push(entry.lot);return `${heading('BIBLIOTECA DE ESTUDOS','Meus terrenos','Um lugar para retomar os estudos do seu workspace.',btn('Novo estudo','plus','new-analysis','primary'))}<div class="project-grid">${saved.map((l,i)=>`<article class="panel project-card"><div class="project-map">${miniMap(i%3)}${status(l.coastal?'PENDENTE':'PRELIMINAR',l.coastal?'pending':'estimated')}</div><div class="project-info"><h3>${esc(l.name)}</h3><p>${esc(l.address)} · João Pessoa, PB</p><div class="project-data"><div><span>ÁREA DO LOTE</span><strong>${number(l.area)} m²</strong></div><div><span>BASE TERRITORIAL</span><strong>Demonstrativa</strong></div></div><button class="btn" data-lot="${l.id}">Abrir estudo ${icon('arrowRight')}</button></div></article>`).join('')}</div><p class="financial-note">Registros mantidos apenas nesta sessão. Recarregar a página restaura os exemplos originais.</p>`}
function sources(){return `${heading('EVIDÊNCIAS E GOVERNANÇA','Fontes que sustentam decisões.','Consulte as referências previstas e entenda o que ainda precisa ser validado.')}<div class="notice">${icon('book')}<div><strong>Catálogo em preparação.</strong> Os links abaixo vêm da especificação. Não houve extração de regras, checagem de vigência ou homologação jurídica neste protótipo.</div></div><div class="search-box source-search section-space">${icon('search')}<input id="source-search" placeholder="Buscar por fonte, órgão ou tema" aria-label="Buscar fontes"></div><div class="sources-grid" id="sources-grid">${sourceCards()}</div>`}
function sourceCards(query=''){const found=sourceData.filter(s=>`${s.title} ${s.org} ${s.type}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));return found.length?found.map(s=>`<article class="panel source-card"><div class="source-card-top"><span class="source-symbol">${icon(s.icon)}</span>${status('PENDENTE','pending')}</div><h3>${s.title}</h3><p>${s.text}</p><div class="source-card-bottom"><span>${s.type}</span><a href="${s.url}" target="_blank" rel="noopener noreferrer">Abrir fonte ${icon('external')}</a></div><p style="margin-bottom:0;font-size:9px">${s.org}</p></article>`).join(''):'<div class="panel source-empty">Nenhuma fonte encontrada para esse termo.</div>'}
function render(){
  if(state.page==='analysis'&&state.step>1&&(!state.lotConfirmed||state.lookupDirty))state.step=1;
  const previousFocus=document.activeElement;
  const focusSelector=rememberControl(previousFocus);
  $$('#sidebar [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  $('#breadcrumb-current').textContent={analysis:'Nova análise',overview:'Visão geral',projects:'Meus terrenos',sources:'Fontes e legislação'}[state.page];
  $('#project-count').textContent=state.saved.size;
  const standardHeading=heading('NOVA ANÁLISE · JOÃO PESSOA / PB','Todo potencial começa com um lugar.','Encontre o terreno por coordenadas ou matrícula e explore seu potencial construtivo.',btn('Ver demonstração','help','tour')+btn('Salvar estudo','folder','save'));
  const explorationHeading=heading(`ESTUDO ${state.lot.id} · ${esc(state.lot.name).toUpperCase()}`,state.step===2?'O que este terreno pode se tornar?':state.variant==='B'?'Dê forma ao potencial do terreno.':state.variant==='C'?'O terreno por todos os ângulos.':'O que este terreno pode se tornar?','Cenários paramétricos, premissas visíveis e decisões mais informadas.',btn('Salvar estudo','folder','save')+btn('Relatório','file','open-report','primary'));
  if(state.page==='analysis'){
    const content=state.step===1?findView():state.step===2?diagnostic():state.variant==='B'&&state.tab==='3d'?studioView():state.variant==='C'&&state.tab==='3d'?summaryView():exploreView();
    $('#main-content').innerHTML=(state.step===1?standardHeading:explorationHeading)+stepper()+content;
  }else $('#main-content').innerHTML=state.page==='overview'?overview():state.page==='projects'?projects():sources();
  $('#variant-label').innerHTML=`0${Object.keys(variants).indexOf(state.variant)+1}<span>${variants[state.variant]}</span>${icon('chevrons')}`;
  $('#variant-label').setAttribute('aria-label',`Escolher layout. Atual: ${variants[state.variant]}`);
  icons();enhanceAccessibility();setupCanvases();syncAccess();
  if(focusSelector && !previousFocus.isConnected) $(focusSelector)?.focus({preventScroll:true});
}
function notify(text){$('#toast').innerHTML=icon('check')+esc(text);$('#toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').classList.remove('show'),6500)}
function modal(title,body,footer='',wide=false){modal.previousFocus=document.activeElement;if(menuOpen)setMenu(false,false);$('#modal-root').innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-button modal-close" data-action="close-modal" aria-label="Fechar">${icon('close')}</button><div class="eyebrow">VIABILEASY · PROTÓTIPO</div><h2 id="modal-title">${title}</h2>${body}${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;syncAccess();$('.modal-close').focus()}
function closeModal(){if(!$('#modal-root').innerHTML)return;$('#modal-root').innerHTML='';syncAccess();const previous=modal.previousFocus;if(previous?.isConnected&&previous.getClientRects().length&&!previous.closest('[inert]'))previous.focus({preventScroll:true});else focusMain(false)}
function about(){modal('Uma primeira experiência do produto.',`<p>Este MVP navegável traduz a especificação técnica v3.0 em uma experiência para explorar terrenos em João Pessoa.</p><div class="modal-section"><h3>O que você pode experimentar</h3><p>Buscar lotes de exemplo, desenhar ou importar um perímetro, consultar premissas, girar a massa em 3D, ajustar o cenário, comparar alternativas e gerar um relatório preliminar.</p></div><div class="modal-section"><h3>Três alternativas de interface</h3><p>Use a barra inferior para alternar entre Mapa & diagnóstico, Estúdio de volumetria e Resumo executivo. O terreno e os parâmetros são compartilhados entre as três opções.</p></div><div class="notice">${icon('info')}Lotes, índices e preços são demonstrativos. Não há motor jurídico homologado, cadastro oficial, autenticação ou armazenamento permanente.</div>`,btn('Explorar demonstração','arrowRight','close-modal','primary'))}
function ruleModal(name){const c=calc();modal('Cada índice precisa de uma origem.',`<p><strong>${esc(name)}</strong> · premissa fictícia do cenário DEMO-JP-01.</p><div class="legal-grid"><div>Status do pacote<strong>Pendente de validação</strong></div><div>Artigo e anexo<strong>Não associados</strong></div><div>CA básico / máximo<strong>2,0 / 3,0</strong></div><div>Projeção efetiva<strong>${number(c.footprint)} m²</strong></div></div><div class="modal-section"><h3>Como o protótipo combina os limites</h3><p>Projeção = menor valor entre TO × área do lote, área após recuos e CA máximo × área do lote ÷ pavimentos. A massa computável é a projeção × pavimentos. Para um polígono importado, utiliza-se uma estimativa de implantação de 58% do lote.</p></div><div class="notice">${icon('alert')}Este valor não foi extraído de lei municipal e não deve ser utilizado para decisões reais.</div>`,btn('Consultar catálogo','book','open-sources','primary'))}

 const raw=(x,y,z)=>{const rx=x*Math.cos(angle)-y*Math.sin(angle),ry=x*Math.sin(angle)+y*Math.cos(angle);return [origin[0]+rx*scale,origin[1]+(ry*Math.sin(el)-z*Math.cos(el))*scale,ry*Math.cos(el)+z*Math.sin(el)]};
 const polygon=(points,fill,stroke='#ffffff44',line=1,dash=[])=>{ctx.beginPath();points.forEach((p,i)=>{const [x,y]=raw(...p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}};
 const line=(a,b,color,width=1,dash=[])=>{const p=raw(...a),q=raw(...b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])};
 const ground=Math.max(lotW,lotD)*.85;
 if(!decor){for(let i=-ground;i<=ground;i+=5){line([i,-ground,-.25],[i,ground,-.25],'#dce4d34d',.6);line([-ground,i,-.25],[ground,i,-.25],'#dce4d34d',.6)}
 polygon([[-lotW/2-6,-lotD/2-6,-.15],[lotW/2+6,-lotD/2-6,-.15],[lotW/2+6,lotD/2+6,-.15],[-lotW/2-6,lotD/2+6,-.15]],'#e6eadd',null);
 polygon([[-lotW/2-5,lotD/2+1,0],[lotW/2+5,lotD/2+1,0],[lotW/2+5,lotD/2+5,0],[-lotW/2-5,lotD/2+5,0]],'#d6ddcd',null);
 }
 const corners=[[-lotW/2,-lotD/2,0],[lotW/2,-lotD/2,0],[lotW/2,lotD/2,0],[-lotW/2,lotD/2,0]];
 polygon(corners,'#d6e4bd','#8ca76a',1,[4,3]);
 const bw=Math.max(1,Math.sqrt(c.footprint*(lotW/lotD))),bd=c.footprint/bw,building=[[-bw/2,-bd/2],[bw/2,-bd/2],[bw/2,bd/2],[-bw/2,bd/2]];
 if(state.setbacks&&!decor){const inset=[[-lotW/2+3,-lotD/2+5,0],[lotW/2-3,-lotD/2+5,0],[lotW/2-3,lotD/2-5,0],[-lotW/2+3,lotD/2-5,0]];polygon(inset,'#c3d6a38a','#91ab70',.8,[3,4])}
 // Ombre projetée, indicative sans calcul solaire.
 polygon(building.map(([x,y])=>[x+7,y+5,0]),'#5a744222',null);
 const floorH=3,faces=[];
 for(let floor=0;floor<state.floors;floor++){
  const z0=floor*floorH+.2,z1=(floor+1)*floorH,shrink=1;
  const p=building.map(([x,y])=>[x*shrink,y*shrink]);
  for(let side=0;side<4;side++){const p1=p[side],p2=p[(side+1)%4],pts=[[...p1,z0],[...p2,z0],[...p2,z1],[...p1,z1]];const dep=pts.reduce((s,v)=>s+raw(...v)[2],0)/4;faces.push({pts,depth:dep,color:['#85aa78','#517d62','#5e8e6c','#a2bc89'][side],floor,side,p1,p2,z0,z1})}
  if(floor===state.floors-1)faces.push({pts:p.map(v=>[...v,z1]),depth:100000,color:'#cbd9b9',roof:true});
 }
 faces.sort((a,b)=>a.depth-b.depth);
 for(const f of faces){polygon(f.pts,f.color,'#eff4e28a',.6);if(f.roof){const z=state.floors*3;polygon([[-bw*.34,-bd*.34,z+.15],[bw*.34,-bd*.34,z+.15],[bw*.34,bd*.34,z+.15],[-bw*.34,bd*.34,z+.15]],'#bbcca6','#8da77a55',.7);continue}
  // Façades, garde-corps et baies schématiques.
  const x1=f.p1[0],y1=f.p1[1],x2=f.p2[0],y2=f.p2[1];
  const glazing=[[x1+(x2-x1)*.09,y1+(y2-y1)*.09,f.z0+.5],[x1+(x2-x1)*.91,y1+(y2-y1)*.91,f.z0+.5],[x1+(x2-x1)*.91,y1+(y2-y1)*.91,f.z1-.4],[x1+(x2-x1)*.09,y1+(y2-y1)*.09,f.z1-.4]];
  polygon(glazing,f.floor===0&&state.use==='Misto'?'#b6c5ac':'#d4e4d242',null);
  for(let j=1;j<5;j++){const t=j/5,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;line([x,y,f.z0+.4],[x,y,f.z1-.4],'#ecf4db77',.7)}
  line([x1,y1,f.z1-.4],[x2,y2,f.z1-.4],'#dfebcd',1);
 }
 if(state.envelope&&!decor){const eh=24;for(let i=0;i<4;i++){const p=corners[i],q=corners[(i+1)%4];line([p[0]*.83,p[1]*.8,0],[p[0]*.83,p[1]*.8,eh],'#809f5970',.8,[3,4]);line([p[0]*.83,p[1]*.8,eh],[q[0]*.83,q[1]*.8,eh],'#809f5980',.8,[3,4])}}
 if(!decor){
 const label=(text,x,y,z,color='#8ca475',size=9)=>{const p=raw(x,y,z);ctx.font=`${size}px "DM Sans",sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,p[0],p[1])};
 label(`${number(lotW)} m`,0,lotD/2+4,0,'#879d72',8);label(`${number(lotD)} m`,-lotW/2-4,0,0,'#879d72',8);
 const hp=raw(bw/2+2,bd/2,c.height/2);ctx.font='9px "DM Sans",sans-serif';ctx.fillStyle='#759565';ctx.fillText(`${c.height} m`,hp[0]+9,hp[1]);
 label('FRENTE DO LOTE',0,lotD/2+9,0,'#9ba88d',7);
 // Norte da cena e escala são referenciais, não uma georreferência homologada.
 const a=raw(-lotW/2-7,-lotD/2,0),b=raw(-lotW/2-7,-lotD/2-7,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle='#6f9054';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#6f9054';ctx.font='8px sans-serif';ctx.fillText('N',b[0],b[1]-5);
 }
}
window.addEventListener('resize',()=>requestAnimationFrame(drawAll));
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');if(variants[v]){state.variant=v;state.step=v==='A'||!state.lotConfirmed||state.lookupDirty?1:3;state.tab='3d';render()}});

const mobileQuery=window.matchMedia('(max-width:1024px)');
let menuOpen=false;
function focusMain(scroll=true){const h=$('main h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}else $('#main-content').focus({preventScroll:true});if(scroll)$('#main-content').scrollTo({top:0,behavior:'instant'})}
function rememberControl(el){if(!el||!el.closest('#main-content'))return null;if(el.id)return '#'+CSS.escape(el.id);for(const key of ['action','product','use','layer','report','tab','scenario'])if(el.dataset[key])return `[data-${key}="${CSS.escape(el.dataset[key])}"]`;return null}
function trapFocus(e,root){if(e.key!=='Tab')return;const items=[...root.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select,textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length&&!x.closest('[inert]'));const first=items[0],last=items.at(-1);if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
function syncAccess(){const hasModal=!!$('.modal');$('#app').inert=hasModal;$('.main-shell').inert=menuOpen;$('#sidebar').inert=mobileQuery.matches&&!menuOpen;$('.prototype-switcher').inert=hasModal||menuOpen;$('.skip-link').inert=hasModal||menuOpen;$('#menu-backdrop').hidden=!menuOpen;$('#menu-backdrop').inert=hasModal;document.body.style.overflow=hasModal||menuOpen?'hidden':'';}
function setMenu(open,restore=true){menuOpen=Boolean(open&&mobileQuery.matches);$('#sidebar').classList.toggle('mobile-open',menuOpen);$('#mobile-menu').setAttribute('aria-expanded',menuOpen);if(menuOpen){$('#sidebar').setAttribute('role','dialog');$('#sidebar').setAttribute('aria-modal','true');$('#sidebar').setAttribute('aria-label','Menu de navegação')}else{for(const a of ['role','aria-modal','aria-label'])$('#sidebar').removeAttribute(a)}syncAccess();if(menuOpen)$('#drawer-close').focus();else if(restore&&mobileQuery.matches)$('#mobile-menu').focus()}
mobileQuery.addEventListener('change',()=>setMenu(false,false));
function chooseLayout(){const descriptions={A:'Localize o lote e consulte o diagnóstico.',B:'Explore o volume com os controles ao lado.',C:'Veja o estudo em uma visão executiva.'};modal('Como você prefere explorar?',`<p>Três formas de ver o mesmo estudo. O terreno e as premissas são mantidos ao alternar.</p><div class="layout-choices">${Object.entries(variants).map(([key,label],i)=>`<button class="layout-choice ${state.variant===key?'active':''}" data-layout="${key}" aria-pressed="${state.variant===key}">${icon(['layers','cube','file'][i])}<span><strong>${label}</strong><small>${descriptions[key]}</small></span>${state.variant===key?status('ATUAL','confirmed'):''}</button>`).join('')}</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-layout]');if(b){const v=b.dataset.layout;closeModal();setVariant(v);focusMain()}});
function modelDescription(){const c=calc();return `${state.floors} pavimentos · ${number(c.height)} m de altura · ${number(c.gross)} m² computáveis · ${activeProduct().name} · ${c.units} ${activeProduct().noun} de ${state.unitArea} m².`}
function updateRangeLabels(){for(const el of $$('input[data-control]'))el.setAttribute('aria-valuetext',el.dataset.control==='floors'?`${el.value} pavimentos`:el.dataset.control==='to'?`${el.value} por cento`:`${el.value} metros quadrados`)}
function announceResults(){clearTimeout(announceResults.timer);announceResults.timer=setTimeout(()=>$('#results-announcement').textContent=modelDescription(),450)}
function updateTableHints(){$$('.table-scroll').forEach(el=>{const hint=el.previousElementSibling;if(hint?.classList.contains('table-hint'))hint.hidden=el.scrollWidth<=el.clientWidth+1})}
function enhanceAccessibility(){
 $('#main-content').setAttribute('aria-busy','false');
 document.title=($('main h1')?.textContent||'Inteligência urbanística')+' | ViabilEasy';
 $$('.report-map [data-map-lot]').forEach(el=>{el.removeAttribute('data-map-lot');el.removeAttribute('role');el.removeAttribute('tabindex');el.removeAttribute('aria-label')});
 $$('.map-controls button,[data-action="layers"]').forEach(b=>b.disabled=!state.lotConfirmed);
 $('.report-map .map-svg')?.setAttribute('aria-label','Mapa esquemático do terreno selecionado para o relatório.');
 $$('#sidebar [data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');b.title=b.textContent.trim()});
 $$('[data-step]').forEach(b=>{const unavailable=Number(b.dataset.step)>1&&(!state.lotConfirmed||state.lookupDirty);b.disabled=unavailable;b.setAttribute('aria-disabled',unavailable);if(Number(b.dataset.step)===state.step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
 $$('[data-action="analyze"]').forEach(b=>b.disabled=!state.lotConfirmed||state.lookupDirty);
 const mobileSelection=$('#map-selection');if(mobileSelection&&!state.lotConfirmed)mobileSelection.remove();
 $$('[data-use]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.use===state.use));updateRangeLabels();
 $$('table').forEach((table,i)=>{
  const title=table.closest('.panel')?.querySelector('h3')?.textContent||'Comparação de cenários';table.setAttribute('aria-label',title);
  table.querySelectorAll('thead th').forEach(th=>th.scope='col');
  if(table.classList.contains('compare-table')||table.classList.contains('sensitivity-table'))table.querySelectorAll('tbody tr').forEach(tr=>{const first=tr.firstElementChild;if(first.tagName==='TD'){const th=document.createElement('th');th.textContent=first.textContent;first.replaceWith(th)}tr.firstElementChild.scope='row'});
  if(!table.parentElement.classList.contains('table-scroll')){const holder=document.createElement('div');holder.className='table-scroll';holder.tabIndex=0;holder.setAttribute('role','region');holder.setAttribute('aria-label',title+'. Tabela com rolagem horizontal.');const hint=document.createElement('p');hint.className='table-hint';hint.id=`table-hint-${i}`;hint.textContent='Deslize a tabela ou use as setas com ela em foco para ver todas as colunas.';holder.setAttribute('aria-describedby',hint.id);table.before(hint,holder);holder.append(table);if(holder.parentElement.style.overflow==='auto')holder.parentElement.style.overflow='hidden';}
 });requestAnimationFrame(updateTableHints);
}
window.addEventListener('resize',updateTableHints);

document.addEventListener('paste',e=>{if(e.target.id!=='lookup-lat')return;const pair=parseCoordinatePair(e.clipboardData?.getData('text')||'');if(!pair)return;e.preventDefault();state.lookupValues.latitude=pair[0];state.lookupValues.longitude=pair[1];$('#lookup-lat').value=pair[0];$('#lookup-lng').value=pair[1];markLookupDirty();$('#results-announcement').textContent='Latitude e longitude preenchidas. Confira e localize o ponto.';});

render();
</script>
</body>
