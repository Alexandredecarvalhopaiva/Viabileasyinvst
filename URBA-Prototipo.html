const variants={A:'Mapa & diagnóstico',B:'Estúdio de volumetria',C:'Resumo executivo'};
const initialVariant=new URLSearchParams(location.search).get('variant');
const state={page:'analysis',step:1,tab:'3d',variant:variants[initialVariant]?initialVariant:'A',lot:lots[0],floors:6,to:50,efficiency:76,unitArea:70,use:'H3',scenario:'base',setbacks:true,envelope:true,rotation:-.55,elevation:.6,zoom:1,mapZoom:1,layers:{parcels:true,zoning:false,constraints:true},layerMenu:false,drawing:false,drawPoints:[],customPolygon:null,price:8200,cost:2700,landPrice:2500000,indirect:22,profit:18,reportGeometry:true,reportAssumptions:true,reportSources:true,saved:new Set(['024','017','031']),savedCustom:{},analyzed:false,notification:false};
if(state.variant==='B'||state.variant==='C') state.step=3;
function calc(lot=state.lot){
  const baseCa=2, maxCa=3, floors=state.floors;
  const legalFootprint=lot.area*state.to/100;
  const width=Math.max(0,lot.width-6),depth=Math.max(0,lot.depth-10);
  const setbackPlate=lot.custom?lot.area*.58:width*depth;
  const footprint=Math.max(0,Math.min(legalFootprint,setbackPlate,lot.area*maxCa/floors));
  const gross=footprint*floors, sellable=gross*state.efficiency/100;
  const units=Math.floor(sellable/state.unitArea),saleArea=units*state.unitArea;
  const retail=state.use==='Misto'?footprint*.45:0;
  const residentialUnits=state.use==='Misto'?Math.max(0,Math.floor((sellable-retail)/state.unitArea)):units;
  const netSale=state.use==='Misto'?residentialUnits*state.unitArea+retail:saleArea;
  const totalBuilt=gross+lot.area*.35;
  const vgv=netSale*state.price,direct=totalBuilt*state.cost,indirect=direct*state.indirect/100;
  const nonLand=direct+indirect,targetProfit=vgv*state.profit/100,residual=vgv-nonLand-targetProfit;
  const margin=vgv>0?(vgv-nonLand-state.landPrice)/vgv*100:0;
  return {baseCa,maxCa,footprint,gross,sellable:netSale,units:residentialUnits,retail,totalBuilt,vgv,direct,indirect,nonLand,targetProfit,residual,margin,height:floors*3,ca:gross/lot.area,parking:Math.floor(lot.area*.35/28)};
}

function controlPanel(){const c=calc();return `<aside class="panel controls-panel"><h3>Seu cenário, suas hipóteses.</h3><p>Explore o volume dentro dos limites fictícios do exemplo.</p><div class="control-field"><div class="control-label">Uso do empreendimento</div><div class="segmented"><button data-use="H3" class="${state.use==='H3'?'active':''}">Residencial H3</button><button data-use="Misto" class="${state.use==='Misto'?'active':''}">Misto</button></div></div><div class="control-field"><label class="control-label" for="floor-range">Pavimentos <strong id="floor-label">${state.floors} pav.</strong></label><input id="floor-range" type="range" min="2" max="8" value="${state.floors}" data-control="floors"><div class="range-caps"><span>2 pavimentos</span><span>8 pavimentos</span></div></div><div class="control-field"><label class="control-label" for="to-range">Ocupação solicitada <strong id="to-label">${state.to}%</strong></label><input id="to-range" type="range" min="20" max="60" step="5" value="${state.to}" data-control="to"><div class="range-caps"><span>20%</span><span>60%</span></div><p class="field-note">Recuos e CA podem limitar a projeção efetiva.</p></div><div class="control-field"><label class="control-label" for="unit-range">Área útil por unidade <strong id="unit-label">${state.unitArea} m²</strong></label><input id="unit-range" type="range" min="35" max="140" step="5" value="${state.unitArea}" data-control="unitArea"><div class="range-caps"><span>35 m²</span><span>140 m²</span></div></div><div class="control-field"><div class="control-label">Camadas do modelo</div><button class="switch-label" data-action="toggle-envelope" aria-pressed="${state.envelope}">Limite de envelope<span class="switch ${state.envelope?'on':''}"></span></button><button class="switch-label" data-action="toggle-setbacks" aria-pressed="${state.setbacks}">Área de recuos<span class="switch ${state.setbacks?'on':''}"></span></button></div><div class="control-field"><div class="scenario-choice"><span>CA efetivo da massa</span><strong id="effective-ca">${number(c.ca,2)}</strong></div><p class="field-note">Eficiência física: ${state.efficiency}%. Sem projeto de garagem ou validação de unidades.</p></div></aside>`}
function scenarioMetrics(){const c=calc();return `<div class="scenario-metrics" id="scenario-metrics">${metric('ÁREA COMPUTÁVEL',`${number(c.gross)} <small>m²</small>`,'Projeção efetiva × pavimentos')}${metric('ÁREA VENDÁVEL',`${number(c.sellable)} <small>m²</small>`,'Unidades inteiras + loja, se houver')}${metric('HIPÓTESE DE UNIDADES',`${c.units} <small>UH</small>`,`${state.unitArea} m² úteis / unidade`,'accent')}${metric('ALTURA SIMULADA',`${c.height} <small>m</small>`,'Pé-direito paramétrico de 3 m')}</div>`}
function exploreView(){return `<div class="tabs" role="tablist" aria-label="Explorar terreno">${[['3d','cube','Volumetria 3D'],['compare','compare','Comparar cenários'],['finance','chart','Viabilidade'],['report','file','Relatório']].map(([id,ico,label])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}" class="${state.tab===id?'active':''}">${icon(ico)}${label}</button>`).join('')}</div>${state.tab==='3d'?`<div class="explorer-layout">${canvasScene()}${controlPanel()}</div>${scenarioMetrics()}<div class="section-space">${criticalNotice()}</div>`:state.tab==='compare'?compareView():state.tab==='finance'?financeView():reportView()}`}
function studioView(){return `<div class="diag-heading"><div><h2>Modele possibilidades.</h2><p>${esc(state.lot.name)} · ${number(state.lot.area)} m² · cenário editável</p></div>${btn('Comparar cenários','compare','open-compare')}</div><div class="studio-layout">${controlPanel()}${canvasScene(true)}<div class="studio-summary" id="studio-summary">${studioSummary()}</div></div><div class="section-space">${criticalNotice()}</div>`}
function studioSummary(){const c=calc();return `${metric('ÁREA COMPUTÁVEL',`${number(c.gross)} <small>m²</small>`,'Capacidade geométrica simulada')}${metric('PRODUTO ESTIMADO',`${c.units} <small>unidades</small>`,`${state.unitArea} m² úteis por unidade`,'accent')}${metric('PROJEÇÃO EFETIVA',`${number(c.footprint)} <small>m²</small>`,`${number(c.footprint/state.lot.area*100,1)}% do terreno`)}`}
function summaryView(){const c=calc();return `<div class="summary-layout"><section><div class="executive-hero"><div class="eyebrow">LEITURA DO TERRENO · ${esc(state.lot.id)}</div><h2>O potencial começa<br>com boas premissas.</h2><p>${esc(state.lot.name)}, João Pessoa.<br>Uma visão integrada para explorar a próxima decisão.</p>${btn('Abrir diagnóstico','arrowRight','diagnosis','primary')}<canvas class="executive-building" data-canvas="decor" aria-label="Ilustração da massa do cenário"></canvas></div><div class="summary-metrics">${metric('TERRENO',`${number(state.lot.area)} <small>m²</small>`,'Lote de demonstração')}${metric('ÁREA COMPUTÁVEL',`${number(c.gross)} <small>m²</small>`,'Cenário paramétrico atual')}${metric('HIPÓTESE DE PRODUTO',`${c.units} <small>unidades</small>`,'Área e eficiência editáveis')}${metric('STATUS DO ESTUDO','Preliminar','Fontes e parâmetros não homologados','accent')}</div><div class="section-title"><h2>Uma decisão em três camadas</h2></div><div class="evidence-row"><span class="evidence-number">01</span><div><h3>Potencial legal</h3><p>Zoneamento, permissões e condicionantes.</p></div>${status('PENDENTE','pending')}</div><div class="evidence-row"><span class="evidence-number">02</span><div><h3>Capacidade geométrica</h3><p>Volume simulado a partir de recuos, TO e CA.</p></div>${status('ESTIMADO')}</div><div class="evidence-row"><span class="evidence-number">03</span><div><h3>Atratividade econômica</h3><p>Receita e custos sob hipóteses explícitas.</p></div>${status('ESTIMADO')}</div></section><aside class="summary-right"><div class="panel"><div class="panel-title"><h3>O cenário em perspectiva</h3>${icon('cube')}</div><canvas class="side-3d-preview" data-canvas="preview" aria-label="Volumetria do cenário"></canvas><div class="side-3d-caption"><span>${state.floors} pavimentos · ${c.height} m</span><button data-action="open-studio">Explorar ${icon('arrowRight')}</button></div></div><div class="panel controls-panel"><div class="panel-kicker">${icon('file')}ESTUDO PRELIMINAR</div><h3 style="margin-top:15px">Leve a análise com você.</h3><p style="margin:9px 0 16px">Relatório com parâmetros, hipóteses e pendências para a próxima conversa com sua equipe.</p>${btn('Visualizar relatório','file','open-report','primary wide')}${btn('Comparar alternativas','compare','open-compare','wide section-space')}</div>${criticalNotice()}</aside></div>`}
function scenarioData(){return [{id:'compact',name:'Compacto',floors:4,to:45},{id:'base',name:'Base',floors:6,to:50},{id:'max',name:'Máximo do exemplo',floors:8,to:60}].map(s=>{const prev={floors:state.floors,to:state.to};Object.assign(state,{floors:s.floors,to:s.to});const c=calc();Object.assign(state,prev);return {...s,...c}})}
function compareView(){const data=scenarioData();const rows=[['Pavimentos',d=>`${d.floors} pavimentos`],['Projeção efetiva',d=>`${number(d.footprint)} m²`],['Área computável',d=>`${number(d.gross)} m²`],['CA efetivo',d=>number(d.ca,2)],['Unidades estimadas',d=>`${d.units} UH de ${state.unitArea} m²`],['Altura geométrica',d=>`${d.height} m`],['Área vendável',d=>`${number(d.sellable)} m²`],['VGV simulado',d=>compact(d.vgv)],['Residual estático',d=>compact(d.residual)]];return `${criticalNotice()}<div class="section-title"><h2>Compare o que muda em cada hipótese.</h2><span>Mesmas premissas de preço e custo</span></div><div class="panel" style="overflow:auto"><table class="compare-table"><thead><tr><th>Parâmetro</th>${data.map(d=>`<th class="${state.scenario===d.id?'selected':''}">${d.name}</th>`).join('')}</tr></thead><tbody>${rows.map(([title,fn])=>`<tr><td>${title}</td>${data.map(d=>`<td class="${state.scenario===d.id?'selected':''}">${fn(d)}</td>`).join('')}</tr>`).join('')}<tr><td>Explorar hipótese</td>${data.map(d=>`<td class="${state.scenario===d.id?'selected':''}"><button class="btn ${state.scenario===d.id?'primary':''}" data-scenario="${d.id}">${state.scenario===d.id?'Selecionado':'Usar cenário'}</button></td>`).join('')}</tr></tbody></table></div><p class="financial-note comparison-note">“Máximo” refere-se somente aos limites fictícios deste protótipo. Unidades e vagas dependem de projeto; valores econômicos não incluem outorga, fluxo mensal ou tributos individualizados.</p>`}
function financeView(){return `<div class="notice print-hide">${icon('info')}<div><strong>Sandbox econômico.</strong> Simulação estática com números editáveis, sem cotações de mercado. Não há recomendação de compra; outorga e fluxo de caixa ainda não foram modelados.</div></div><div class="finance-layout section-space"><form class="panel finance-form" id="finance-form"><div class="panel-kicker">${icon('settings')}PREMISSAS DO CENÁRIO</div>${financeField('Preço realizável','price',state.price,'R$','/ m²')}${financeField('Custo direto de obra','cost',state.cost,'R$','/ m²')}${financeField('Preço proposto do terreno','landPrice',state.landPrice,'R$','')}${financeField('Indiretos e contingência','indirect',state.indirect,'','%')}${financeField('Lucro alvo sobre VGV','profit',state.profit,'','%')}<p class="field-note">Obra aplicada à área construída total: área computável + 35% do lote em apoio/garagem. Hipótese física simplificada, sem projeto de vagas.</p><button class="btn primary wide" type="submit">${icon('rotate')}Atualizar simulação</button></form><div class="finance-results" id="finance-results">${financeResults()}</div></div>`}
function financeField(label,id,value,prefix,suffix){return `<div class="form-field"><label for="fin-${id}">${label}</label><div class="input-affix"><span>${prefix}</span><input id="fin-${id}" name="${id}" type="number" min="0" max="${id==='profit'||id==='indirect'?100:1000000000}" step="${id==='profit'||id==='indirect'?1:100}" value="${value}" required><span>${suffix}</span></div></div>`}
function financeResults(){const c=calc(),values=[c.vgv,c.direct,c.indirect,c.targetProfit,c.residual],names=['VGV','Obra direta','Indiretos','Lucro alvo','Residual'];return `<div class="metrics-grid">${metric('VGV SIMULADO',compact(c.vgv),`${number(c.sellable)} m² vendáveis × ${money(state.price)}/m²`)}${metric('CUSTO SEM TERRENO',compact(c.nonLand),`${number(c.totalBuilt)} m² construídos · base simplificada`)}${metric('RESIDUAL ESTÁTICO',compact(c.residual),'Após custo sem terreno e lucro alvo','accent')}</div><div class="panel chart-panel"><div class="chart-heading"><h3>Da receita ao residual</h3><span>Valores nominais · R$ milhões</span></div><div class="waterfall">${values.map((v,i)=>`<div class="waterfall-item"><div class="waterfall-bar" style="height:${Math.max(3,Math.min(100,Math.abs(v)/Math.max(1,c.vgv)*100))}%"><span class="waterfall-value">${number(v/1e6,2)}</span></div><span class="waterfall-label">${names[i]}</span></div>`).join('')}</div><p class="financial-note">Residual = VGV − custo sem terreno − lucro alvo. Margem ilustrativa com o terreno a ${money(state.landPrice)}: <strong>${number(c.margin,1)}%</strong>. Valores não incluem outorga nem desconto a valor presente.</p></div><div class="panel chart-panel"><div class="chart-heading"><h3>E se preço e custo mudarem?</h3><span>Residual estático</span></div><table class="sensitivity-table"><thead><tr><th>Custo ↓ / preço →</th><th>−10%</th><th>Base</th><th>+10%</th></tr></thead><tbody>${[1.1,1,.9].map((costFactor,r)=>`<tr><th>${r===0?'+10%':r===1?'Base':'−10%'}</th>${[.9,1,1.1].map((priceFactor,col)=>{const v=c.vgv*priceFactor*(1-state.profit/100)-c.nonLand*costFactor;return `<td class="${r===1&&col===1?'base':v<0?'stress':''}">${compact(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table><p class="financial-note">Preço realizável e custos variam de forma independente. TIR, VPL, permuta e financiamento pertencem às próximas ondas do produto.</p></div></div>`}
function reportView(){const c=calc(),l=state.lot;return `<div class="report-layout"><article class="report-paper" id="report-paper"><div class="report-letterhead"><span class="report-logo">urba.</span><small>INTELIGÊNCIA URBANÍSTICA<br>ESTUDO DEMONSTRATIVO · ${esc(l.id)} / 2026</small></div><h2>Estudo de potencial construtivo</h2><p>${esc(l.name)} · João Pessoa / PB<br>Lote fictício ${esc(l.id)} · ${number(l.area)} m²</p><div class="report-watermark">PRELIMINAR · DADOS DEMONSTRATIVOS</div><div class="report-block"><h3>01 · Identificação e cenário</h3><div class="report-keyvalues"><div><span>Área do terreno</span><strong>${number(l.area)} m²</strong></div><div><span>Uso simulado</span><strong>${state.use==='H3'?'Residencial H3':'Misto'}</strong></div><div><span>Pavimentos</span><strong>${state.floors}</strong></div><div><span>Área computável</span><strong>${number(c.gross)} m²</strong></div><div><span>Projeção efetiva</span><strong>${number(c.footprint)} m²</strong></div><div><span>Hipótese de produto</span><strong>${c.units} UH · ${state.unitArea} m²</strong></div></div></div>${state.reportGeometry?`<div class="report-block"><h3>02 · Massa conceitual</h3><div class="report-visuals"><div class="report-map">${mapSvg()}</div><canvas class="report-canvas" data-canvas="report" aria-label="Massa conceitual para o relatório"></canvas></div></div>`:''}${state.reportAssumptions?`<div class="report-block"><h3>03 · Premissas e limites</h3><p>CA básico 2,0 e máximo 3,0; TO solicitada de ${state.to}%; permeabilidade de referência de 20%; recuos de 5 m à frente e aos fundos e 3 m nas laterais. Todos estes parâmetros são fictícios. Terreno plano assumido, sem levantamento topográfico. Eficiência de ${state.efficiency}%. A massa não valida acesso, acessibilidade, garagem, ventilação, implantação ou projeto arquitetônico.</p><p style="margin-top:7px">VGV: ${money(c.vgv)}. Custo direto: ${money(state.cost)}/m² construído. Residual estático: ${money(c.residual)}. Simulação sem outorga, fluxo mensal e revisão fiscal. Não representa recomendação de aquisição.</p></div>`:''}<div class="report-block"><h3>04 · Pendências para validação</h3><p>${l.coastal?'BLOQUEADO: enquadramento da orla e eventuais regimes jurídicos concorrentes. ':''}PENDENTE: cadastro oficial do lote, zoneamento e classe viária. PENDENTE: artigos, anexos, vigência e validação jurídica do pacote de regras. PENDENTE: topografia e restrições ambientais/patrimoniais. Sem responsável técnico ou aprovação de órgão competente.</p></div>${state.reportSources?`<div class="report-block"><h3>05 · Origem e rastreabilidade</h3><p>Referência de produto: Especificação Técnica Consolidada v3.0, de 16/10/2026. Dados territoriais e índices: conjunto sintético DEMO-JP-01. Modelo: URBA prototype 0.1. Catálogo normativo não homologado. Não há hash de pacote legal ativo, assinatura técnica ou consulta em tempo real.</p><div class="report-extras">Fontes previstas, sem integração nesta demonstração: PDMJP / legislação vigente; Filipeia / Atlas municipal; SUDEMA; CBMPB.</div></div>`:''}<div class="report-extras">Gerado em ${new Date().toLocaleDateString('pt-BR',{timeZone:'America/Fortaleza'})} · Cenário ${esc({base:'base',compact:'compacto',max:'máximo do exemplo',custom:'personalizado'}[state.scenario]||state.scenario)} · O estudo é uma demonstração de interface e não substitui análise técnica, certidão urbanística ou projeto.</div></article><aside class="panel report-options"><h3>Preparar relatório</h3><label><input type="checkbox" data-report="reportGeometry" ${state.reportGeometry?'checked':''}>Incluir volumetria</label><label><input type="checkbox" data-report="reportAssumptions" ${state.reportAssumptions?'checked':''}>Incluir premissas</label><label><input type="checkbox" data-report="reportSources" ${state.reportSources?'checked':''}>Incluir rastreabilidade</label>${btn('Imprimir / salvar PDF','download','print','primary wide')}${btn('Exportar cenário JSON','code','export','wide')}<p class="field-note">Na janela de impressão do navegador, escolha “Salvar como PDF”. Pendências críticas permanecem no relatório.</p></aside></div>`}
function overview(){const c=calc();return `${heading('SEU WORKSPACE','Um novo olhar sobre cada terreno.','Organize estudos e transforme hipóteses em conversas mais claras.') }<div class="overview-hero"><div><div class="eyebrow">INTELIGÊNCIA PARA EXPLORAR</div><h2>Antes de construir,<br>entenda as possibilidades.</h2><p>Território, regras e produto em uma mesma análise.</p>${btn('Começar uma análise','arrowRight','new-analysis','primary')}</div><div class="overview-decoration"><canvas data-canvas="decor" aria-label="Volumetria ilustrativa"></canvas></div></div><div class="overview-stats">${metric('TERRENOS NO WORKSPACE',state.saved.size,'Registros de demonstração')}${metric('CENÁRIOS PARA EXPLORAR','3','Compacto, base e máximo do exemplo')}${metric('FONTES MAPEADAS','4','Referências para futura integração')}${metric('BASE HOMOLOGADA','Pendente','O protótipo utiliza dados sintéticos','accent')}</div>${recentCards()}<div class="section-space">${criticalNotice()}</div>`}
function projects(){const saved=lots.filter(l=>state.saved.has(l.id));for(const entry of Object.values(state.savedCustom))if(state.saved.has(entry.lot.id))saved.push(entry.lot);return `${heading('BIBLIOTECA DE ESTUDOS','Meus terrenos','Um lugar para retomar os estudos do seu workspace.',btn('Novo estudo','plus','new-analysis','primary'))}<div class="project-grid">${saved.map((l,i)=>`<article class="panel project-card"><div class="project-map">${miniMap(i%3)}${status(l.coastal?'PENDENTE':'PRELIMINAR',l.coastal?'pending':'estimated')}</div><div class="project-info"><h3>${esc(l.name)}</h3><p>${esc(l.address)} · João Pessoa, PB</p><div class="project-data"><div><span>ÁREA DO LOTE</span><strong>${number(l.area)} m²</strong></div><div><span>BASE TERRITORIAL</span><strong>Demonstrativa</strong></div></div><button class="btn" data-lot="${l.id}">Abrir estudo ${icon('arrowRight')}</button></div></article>`).join('')}</div><p class="financial-note">Registros mantidos apenas nesta sessão. Recarregar a página restaura os exemplos originais.</p>`}
function sources(){return `${heading('EVIDÊNCIAS E GOVERNANÇA','Fontes que sustentam decisões.','Consulte as referências previstas e entenda o que ainda precisa ser validado.')}<div class="notice">${icon('book')}<div><strong>Catálogo em preparação.</strong> Os links abaixo vêm da especificação. Não houve extração de regras, checagem de vigência ou homologação jurídica neste protótipo.</div></div><div class="search-box source-search section-space">${icon('search')}<input id="source-search" placeholder="Buscar por fonte, órgão ou tema" aria-label="Buscar fontes"></div><div class="sources-grid" id="sources-grid">${sourceCards()}</div>`}
function sourceCards(query=''){const found=sourceData.filter(s=>`${s.title} ${s.org} ${s.type}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));return found.length?found.map(s=>`<article class="panel source-card"><div class="source-card-top"><span class="source-symbol">${icon(s.icon)}</span>${status('PENDENTE','pending')}</div><h3>${s.title}</h3><p>${s.text}</p><div class="source-card-bottom"><span>${s.type}</span><a href="${s.url}" target="_blank" rel="noopener noreferrer">Abrir fonte ${icon('external')}</a></div><p style="margin-bottom:0;font-size:9px">${s.org}</p></article>`).join(''):'<div class="panel source-empty">Nenhuma fonte encontrada para esse termo.</div>'}
function render(){
  $$('#sidebar [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  $('#breadcrumb-current').textContent={analysis:'Nova análise',overview:'Visão geral',projects:'Meus terrenos',sources:'Fontes e legislação'}[state.page];
  $('#project-count').textContent=state.saved.size;
  const standardHeading=heading('NOVA ANÁLISE · JOÃO PESSOA / PB','Todo potencial começa com um lugar.','Localize o terreno. Entenda as regras. Explore o que pode nascer aqui.',btn('Ver demonstração','help','tour')+btn('Salvar estudo','folder','save'));
  const explorationHeading=heading(`ESTUDO ${state.lot.id} · ${esc(state.lot.name).toUpperCase()}`,state.variant==='B'?'Dê forma ao potencial do terreno.':state.variant==='C'?'O terreno por todos os ângulos.':'Explore o que pode nascer aqui.','Cenários paramétricos, premissas visíveis e decisões mais informadas.',btn('Salvar estudo','folder','save')+btn('Relatório','file','open-report','primary'));
  if(state.page==='analysis'){
    const content=state.step===1?findView():state.step===2?diagnostic():state.variant==='B'&&state.tab==='3d'?studioView():state.variant==='C'&&state.tab==='3d'?summaryView():exploreView();
    $('#main-content').innerHTML=(state.step===1?standardHeading:explorationHeading)+stepper()+content;
  }else $('#main-content').innerHTML=state.page==='overview'?overview():state.page==='projects'?projects():sources();
  $('#variant-label').innerHTML=`0${Object.keys(variants).indexOf(state.variant)+1}<span>${variants[state.variant]}</span>`;
  icons();setupCanvases();
}
function notify(text){$('#toast').innerHTML=icon('check')+esc(text);$('#toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function modal(title,body,footer='',wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-button modal-close" data-action="close-modal" aria-label="Fechar">${icon('close')}</button><div class="eyebrow">URBA · PROTÓTIPO</div><h2 id="modal-title">${title}</h2>${body}${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;modal.previousFocus=document.activeElement;$('.modal-close').focus();document.body.style.overflow='hidden'}

function searchLot(query){const q=query.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(!q){notify('Digite Jardim Oceania, Bessa, Cabo Branco ou coordenadas.');return}

 if(found){selectLot(found.id);return}

 if(pair.length===2){const [lat,lng]=pair;if(Math.abs(lat)>90||Math.abs(lng)>180){notify('Coordenadas inválidas. Use latitude e longitude WGS84.');return}if(lat<-7.3||lat>-7||lng<-35||lng>-34.75){modal('Fora do recorte demonstrativo.',`<p>Use um ponto próximo de João Pessoa. O protótipo não consulta cadastro oficial; as coordenadas são apenas uma entrada para confirmar o fluxo.</p>`,btn('Voltar','','close-modal','primary'));return}const near=lots.reduce((a,b)=>Math.hypot(a.lat-lat,a.lng-lng)<Math.hypot(b.lat-lat,b.lng-lng)?a:b);modal('Nenhum lote cadastral foi consultado.',`<p>Coordenadas recebidas: ${esc(query)}.</p><p>Como não há integração GIS nesta demonstração, você pode explorar o exemplo de ${near.name}, importar um GeoJSON ou desenhar um perímetro.</p>`,btn('Voltar','','close-modal')+`<button class="btn primary" id="use-example">Explorar exemplo ${icon('arrowRight')}</button>`);$('#use-example').onclick=()=>{closeModal();selectLot(near.id)};return}

function polygonArea(points){let a=0;for(let i=0;i<points.length;i++){const [x,y]=points[i],[x2,y2]=points[(i+1)%points.length];a+=x*y2-x2*y}return Math.abs(a)/2}
function selfIntersects(p){const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){if(j===i+1||i===0&&j===p.length-1)continue;const a=p[i],b=p[(i+1)%p.length],c=p[j],d=p[(j+1)%p.length];if(cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0)return true}return false}

$('#geojson-input').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2e6){notify('Use um GeoJSON com até 2 MB para esta demonstração.');return}try{

 polygon(corners,'#d6e4bd','#8ca76a',1,[4,3]);
 const bw=Math.max(1,Math.sqrt(c.footprint*(lotW/lotD))),bd=c.footprint/bw,building=[[-bw/2,-bd/2],[bw/2,-bd/2],[bw/2,bd/2],[-bw/2,bd/2]];
 if(state.setbacks&&!decor){const inset=[[-lotW/2+3,-lotD/2+5,0],[lotW/2-3,-lotD/2+5,0],[lotW/2-3,lotD/2-5,0],[-lotW/2+3,lotD/2-5,0]];polygon(inset,'#c3d6a38a','#91ab70',.8,[3,4])}
 // Ombre projetée, indicative sans calcul solaire.
 polygon(building.map(([x,y])=>[x+7,y+5,0]),'#5a744222',null);
 const floorH=3,faces=[];
 for(let floor=0;floor<state.floors;floor++){
  const z0=floor*floorH+.2,z1=(floor+1)*floorH,shrink=1;
  const p=building.map(([x,y])=>[x*shrink,y*shrink]);
  for(let side=0;side<4;side++){const p1=p[side],p2=p[(side+1)%4],pts=[[...p1,z0],[...p2,z0],[...p2,z1],[...p1,z1]];const dep=pts.reduce((s,v)=>s+raw(...v)[2],0)/4;faces.push({pts,depth:dep,color:['#85aa78','#517d62','#5e8e6c','#a2bc89'][side],floor,side,p1,p2,z0,z1})}
  if(floor===state.floors-1)faces.push({pts:p.map(v=>[...v,z1]),depth:100000,color:'#cbd9b9',roof:true});
 }
 faces.sort((a,b)=>a.depth-b.depth);
 for(const f of faces){polygon(f.pts,f.color,'#eff4e28a',.6);if(f.roof){const z=state.floors*3;polygon([[-bw*.34,-bd*.34,z+.15],[bw*.34,-bd*.34,z+.15],[bw*.34,bd*.34,z+.15],[-bw*.34,bd*.34,z+.15]],'#bbcca6','#8da77a55',.7);continue}
  // Façades, garde-corps et baies schématiques.
  const x1=f.p1[0],y1=f.p1[1],x2=f.p2[0],y2=f.p2[1];
  const glazing=[[x1+(x2-x1)*.09,y1+(y2-y1)*.09,f.z0+.5],[x1+(x2-x1)*.91,y1+(y2-y1)*.91,f.z0+.5],[x1+(x2-x1)*.91,y1+(y2-y1)*.91,f.z1-.4],[x1+(x2-x1)*.09,y1+(y2-y1)*.09,f.z1-.4]];
  polygon(glazing,f.floor===0&&state.use==='Misto'?'#b6c5ac':'#d4e4d242',null);
  for(let j=1;j<5;j++){const t=j/5,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;line([x,y,f.z0+.4],[x,y,f.z1-.4],'#ecf4db77',.7)}
  line([x1,y1,f.z1-.4],[x2,y2,f.z1-.4],'#dfebcd',1);
 }
 if(state.envelope&&!decor){const eh=24;for(let i=0;i<4;i++){const p=corners[i],q=corners[(i+1)%4];line([p[0]*.83,p[1]*.8,0],[p[0]*.83,p[1]*.8,eh],'#809f5970',.8,[3,4]);line([p[0]*.83,p[1]*.8,eh],[q[0]*.83,q[1]*.8,eh],'#809f5980',.8,[3,4])}}
 if(!decor){
 const label=(text,x,y,z,color='#8ca475',size=9)=>{const p=raw(x,y,z);ctx.font=`${size}px "DM Sans",sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,p[0],p[1])};
 label(`${number(lotW)} m`,0,lotD/2+4,0,'#879d72',8);label(`${number(lotD)} m`,-lotW/2-4,0,0,'#879d72',8);
 const hp=raw(bw/2+2,bd/2,c.height/2);ctx.font='9px "DM Sans",sans-serif';ctx.fillStyle='#759565';ctx.fillText(`${c.height} m`,hp[0]+9,hp[1]);
 label('FRENTE DO LOTE',0,lotD/2+9,0,'#9ba88d',7);
 // Norte da cena e escala são referenciais, não uma georreferência homologada.
 const a=raw(-lotW/2-7,-lotD/2,0),b=raw(-lotW/2-7,-lotD/2-7,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle='#6f9054';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#6f9054';ctx.font='8px sans-serif';ctx.fillText('N',b[0],b[1]-5);
 }
}
window.addEventListener('resize',()=>requestAnimationFrame(drawAll));
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');if(variants[v]){state.variant=v;state.step=v==='A'?1:3;state.tab='3d';render()}});
render();
</script>
