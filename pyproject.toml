[project]
name = "viabileasy"
version = "0.15.0"
description = "Backend Python do ViabilEasy e servidor do frontend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.3.6", "httpx==0.28.1", "python-dotenv==1.2.4",
  "google-auth==2.62.0", "requests==2.34.2", "Pillow==13.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
